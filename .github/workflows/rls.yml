# =============================================================================
# .github/workflows/rls.yml
# Session 2 — RLS coverage + pgTAP suite for the RABBIT database.
#
# Repo layout note: the app lives in a WILSON/ subdirectory under the git
# root. `defaults.run.working-directory: WILSON` makes every bash step run
# inside that subdir so paths match the local dev experience.
#
# What this runs:
#   1. Supabase CLI boots a local Postgres with every migration in
#      WILSON/supabase/migrations/ applied.
#   2. `supabase test db` runs pg_prove against every file in
#      WILSON/supabase/tests/rls/*.sql — one test per RABBIT table.
#   3. A bash coverage guard fails the job if a table in the RLS allowlist
#      is missing its dedicated test file.
#
# Scope: every push to feat/* and every PR. Intentionally NOT on pushes to
# main — branch protection makes that redundant.
# =============================================================================

name: RLS tests

on:
  push:
    branches:
      - 'feat/**'
      - 'track-*'       # the parallel fix tracks (docs/sessions/HANDOFF_PROTOCOL.md), 2026-09-07
      - 'demo/**'        # the Friday demo sprint (docs/sessions/DEMO_2026-09-11_PLAN.md), 2026-09-08
      - 'ui/**'
      - 'po/**'          # post-overhaul session branches: POST_OVERHAUL_PLAN.md has CI run on every session push, and po/** never triggered it, 2026-09-30
  pull_request:
    branches:
      - main
      - 'feat/**'

jobs:
  pgtap:
    name: pgTAP (Supabase local DB)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: WILSON
    steps:
      - uses: actions/checkout@v4

      # 🚨 PINNED, not `latest` (2026-10-05, Audrey's yes). `version: latest`
      # makes the action ask GitHub which release is newest on every run, and
      # that lookup is rate-limited: when it is refused this step fails with
      # "Failed to resolve latest Supabase CLI release: rate limit exceeded"
      # (run 36814568208's annotation) before a single test runs, and "Stop
      # Supabase" then exits 127 behind it — at least four red runs on green
      # code between 2026-08-17 and 2026-10-01. A pinned version needs no
      # lookup. 2.119.0 is the stable release from 2026-09-30, the one every
      # green run from 2026-10-01 to 2026-10-05 resolved `latest` to. To move
      # it: change the number, push, and read this job's result first.
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.119.0

      # Coverage guard — runs BEFORE spinning up Postgres so we fail fast.
      # RLS_TABLES is the allowlist of every RABBIT table under RLS. Adding a
      # new table to migration 0004 without a test file in supabase/tests/rls/
      # will cause this step to fail. Keep this list in sync with the
      # post-condition block at the bottom of 0004_rls_rabbit.sql.
      - name: Enforce per-table test coverage
        run: |
          set -euo pipefail
          RLS_TABLES=(
            projects phases assets tasks files
            comments rate_cards rate_card_entries
            asset_versions task_dependencies phase_dependencies task_links
            ingestion_runs ingestion_chunks
            edit_history
            project_members
            notes note_subjects
            app_events
            auth_events
            otter_courses otter_subjects otter_progress
            otter_course_editors otter_change_requests
            otter_course_nominations
            otter_quiz_attempts
            workspace_ai_keys platform_audit edge_rate_limits
            platform_approved_models platform_model_defaults
            workspace_model_overrides user_model_overrides
            budget_lines budget_actuals budget_versions
            expenses project_rate_overrides
            scenes shots levels experiences
            folders
            task_templates
            user_pets user_settings
            workspace_storage
            workspace_storage_secrets
            workspace_storage_plans
            milestones
            upload_reservations
            shot_lists shot_list_items edits
            bins shot_takes
            gateways
          )
          # The two-directional step below (after Postgres is up) reads the same
          # list back, so the two never disagree about what "listed" means.
          printf '%s\n' "${RLS_TABLES[@]}" > /tmp/rls_tables.txt
          MISSING=()
          for t in "${RLS_TABLES[@]}"; do
            # NN_<table>.sql exactly — not *_<table>.sql, which
            # 80_private_projects.sql also satisfies for `projects` (merge
            # review round 2, A-R2-05): a column suite must never stand in
            # for a table's own.
            if ! ls supabase/tests/rls/[0-9][0-9]_"${t}".sql >/dev/null 2>&1; then
              MISSING+=("${t}")
            fi
          done
          if [ "${#MISSING[@]}" -ne 0 ]; then
            echo "::error::Tables without an RLS test file: ${MISSING[*]}"
            echo "Expected pattern: WILSON/supabase/tests/rls/NN_<table>.sql"
            exit 1
          fi
          echo "RLS test coverage OK for ${#RLS_TABLES[@]} tables."

      # 🚨 `supabase start` APPLIES EVERY MIGRATION to a fresh database, so a
      # migration that is fine against dev and staging (which skip 0065, and
      # already hold the objects it creates) can still fail HERE — and until
      # 2026-09-07 the only thing it produced was "Process completed with exit
      # code 1". Full logs need repo admin; annotations are public. This is the
      # same argument the pgTAP steps below already make, applied to the step
      # that fails first and says least.
      - name: Start Supabase local DB
        run: |
          set -o pipefail
          supabase start --exclude realtime,storage-api,imgproxy,edge-runtime,studio,mailpit 2>&1 | tee /tmp/start.log

      - name: Annotate a failed start
        if: failure()
        run: |
          # A migration failure surfaces as `ERROR: …` plus the statement; the
          # cap keeps one broken migration from exhausting GitHub's 10-per-step
          # annotation budget before the useful line is reached.
          grep -nE 'ERROR|FATAL|error:|failed|Failed|does not exist|violates' /tmp/start.log \
            | head -12 \
            | while IFS= read -r line; do
                echo "::error title=supabase start::${line}"
              done
          echo "----- supabase start output (tail 80) -----"
          tail -80 /tmp/start.log || true

      # Track C / C2 (2026-09-07): THE GUARD IS NOW TWO-DIRECTIONAL. The step
      # above proves every table in RLS_TABLES has a suite; nothing ever proved
      # that every RLS-ENABLED table is in RLS_TABLES. Measured on 2026-09-06:
      # eight tables had RLS on and no entry (auth_attempt_log, file_events,
      # otter_quiz_attempts, otter_subject_shares, platform_operators,
      # storage_gc_queue, workspace_members, workspaces) — a hole the list could
      # never see, because the list only knows the names it was given. So, with
      # the database up and every migration applied, enumerate
      # pg_class.relrowsecurity in public and require each name to be
      #   (a) in RLS_TABLES (its suite is *_<table>.sql, checked above), or
      #   (b) in COVERED_BY — a table whose suite is named for something else
      #       (file_events → 33_file_lifecycle), with that file's existence
      #       checked here, or
      #   (c) in KNOWN_UNCOVERED, with the reason, surfaced as a warning.
      # Anything else is a red step: a NEW RLS table lands with its suite and
      # its entry, or CI says so. And the converse: a name in RLS_TABLES that
      # the database does NOT protect is a suite testing a table with RLS off
      # (or a typo the glob happened to match) — also red.
      #
      # Ownership (FIX_PLAN "Rules for running tracks in tandem", HANDOFF §6):
      # each track adds its own names with its suite, on its branch; Track C
      # resolves the adjacent-line conflicts in these lists when branches meet.
      - name: Enforce coverage is two-directional (every RLS-enabled table is accounted for)
        run: |
          set -euo pipefail
          command -v psql >/dev/null 2>&1 || { sudo apt-get update >/dev/null; sudo apt-get install -y postgresql-client >/dev/null; }
          RLS_TABLES_FILE=/tmp/rls_tables.txt   # written by the coverage guard above
          declare -A COVERED_BY=(
            [file_events]=33_file_lifecycle          # 0027; 78_file_events_money adds the money arm
            [storage_gc_queue]=33_file_lifecycle     # 0027; 63/64 cover its later columns
            [platform_operators]=35_platform_audit   # 0028
            [auth_attempt_log]=35_platform_audit     # 0001; operator-read only
            [workspaces]=37_workspace_write_lockdown # 0001; also 15, 24, 38
            [workspace_members]=14_ws_members_self   # 0001; also 16, 38, 67
            # Bins on the cloud (BC1, 0091): one suite covers the three bins
            # tables (the brief gave the bundle suite 93), so `bins` is in
            # RLS_TABLES with 93_bins.sql and its two siblings map here —
            # the file_events → 33_file_lifecycle shape. shot_takes has its
            # own, 94_shot_takes.sql.
            [bin_files]=93_bins                      # 0091
            [bin_locations]=93_bins                  # 0091
            # The file gateway's cloud side (GW1, 0093): one suite covers its
            # six tables (the brief gave the bundle suite 96), so `gateways`
            # is in RLS_TABLES with 96_gateways.sql and its five siblings map
            # here — 93_bins' shape.
            [gateway_secrets]=96_gateways            # 0093
            [gateway_enrolment_tokens]=96_gateways   # 0093
            [gateway_signing_keys]=96_gateways       # 0093
            [gateway_ticket_mints]=96_gateways       # 0093
            [workspace_audit]=96_gateways            # 0093
          )
          declare -A KNOWN_UNCOVERED=(
            [otter_subject_shares]="0065 is UNAPPLIED on every environment and has no suite until Phase 5c builds the feature; CI applies it because the file is in the tree"
          )
          ENABLED=$(PGPASSWORD=postgres psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -t -A --no-psqlrc \
            -c "SELECT c.relname FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace
                 WHERE n.nspname = 'public' AND c.relkind IN ('r','p') AND c.relrowsecurity ORDER BY 1")
          if [ -z "$ENABLED" ]; then
            echo "::error::The RLS enumeration returned nothing — the database is not up or has no RLS tables, and this guard cannot be trusted"
            exit 1
          fi
          # A file, not `echo | grep -q`: under pipefail a grep that exits on its
          # first match can hand echo a SIGPIPE and turn a MATCH into a failure.
          printf '%s\n' $ENABLED > /tmp/rls_enabled.txt
          UNACCOUNTED=()
          for t in $ENABLED; do
            if grep -qx "$t" "$RLS_TABLES_FILE"; then continue; fi
            if [ -n "${COVERED_BY[$t]:-}" ]; then
              if ! ls supabase/tests/rls/"${COVERED_BY[$t]}".sql >/dev/null 2>&1; then
                echo "::error::${t} is mapped to ${COVERED_BY[$t]}.sql, which does not exist"
                exit 1
              fi
              continue
            fi
            if [ -n "${KNOWN_UNCOVERED[$t]:-}" ]; then
              echo "::warning::${t} has RLS enabled and NO suite — known: ${KNOWN_UNCOVERED[$t]}"
              continue
            fi
            UNACCOUNTED+=("$t")
          done
          if [ "${#UNACCOUNTED[@]}" -ne 0 ]; then
            echo "::error::RLS-enabled tables in neither RLS_TABLES, COVERED_BY nor KNOWN_UNCOVERED: ${UNACCOUNTED[*]}"
            echo "Add the table to RLS_TABLES with its NN_<table>.sql suite, or map it in COVERED_BY to the suite that already pins it."
            exit 1
          fi
          NOT_ENABLED=()
          while IFS= read -r t; do
            [ -z "$t" ] && continue
            grep -qx "$t" /tmp/rls_enabled.txt || NOT_ENABLED+=("$t")
          done < "$RLS_TABLES_FILE"
          if [ "${#NOT_ENABLED[@]}" -ne 0 ]; then
            echo "::error::Tables in RLS_TABLES without RLS enabled in the database: ${NOT_ENABLED[*]}"
            exit 1
          fi
          echo "Two-directional RLS coverage OK: $(echo "$ENABLED" | wc -w) RLS-enabled tables accounted for."

      # 🚨 THE SUITE'S OWN OUTPUT IS THE PRIMARY DIAGNOSTIC, and until
      # 2026-08-12 nothing captured it. pg_prove's summary NAMES the failing
      # file and the failing test number; the replay step below can only guess.
      # Full logs need repo admin, so anything not turned into an ::error::
      # annotation is invisible to everyone without admin rights — which is how
      # the 2026-08-11 break survived three blind fixes and ten red runs.
      - name: Run pgTAP suite
        run: |
          set -o pipefail
          supabase test db 2>&1 | tee /tmp/pgtap.log

      - name: Annotate pgTAP failure
        if: failure()
        run: |
          # pg_prove emits TAP: "not ok 12 - ...", "# Failed test ...",
          # "# Looks like you failed 1 test of 30", and a Result: FAIL summary.
          # Cap at 20 so one broken suite cannot exhaust GitHub's 10-per-step
          # annotation budget before the useful lines are reached.
          grep -nE 'not ok|# +Failed test|# +Looks like|Result: FAIL|ERROR|FATAL|could not' /tmp/pgtap.log \
            | head -20 \
            | while IFS= read -r line; do
                echo "::error title=pgTAP::${line}"
              done
          echo "----- full pgTAP output (tail 120) -----"
          tail -120 /tmp/pgtap.log || true

      - name: Capture logs on failure
        if: failure()
        run: |
          supabase --version || true
          supabase logs db || true
          # pg_prove's TAP summary hides the underlying SQL error — replay
          # the suites through raw psql against the local stack (db on
          # 54322) so the exact failing statement + SQLSTATE show up in the
          # job log. 03_assets is a Session-2 file that was green for
          # months; 14 is the workspace_members suite.
          #
          # Session 17: the list previously stopped at 32, so suites 33-38
          # failed INVISIBLY — the annotations said "replay produced no
          # ERROR lines" for every file it did replay while the actual
          # failure sat in a suite it never touched. Keep this list
          # exhaustive when adding a suite.
          #
          # Session 26: it is now EXHAUSTIVE, which it had never actually
          # been. Adding 52_folders exposed that thirteen of the original
          # Session-2 suites (01, 02, 04-13, 15) had never been in it at all
          # — the list began life as a curated set of suspects and only
          # became append-everything from 16 onward. Those thirteen still
          # FAILED the job when they failed; what they could not do is say
          # why, which is the whole purpose of this step. All 54 are here.
          #
          # Session 27: 53_money_segments.sql is the first suite that covers
          # no table of its own — it pins storage.objects policies and a
          # predicate function. The coverage guard above globs by TABLE name
          # (*_<table>.sql), so a suite like this is invisible to it and
          # nothing would have complained had it been left out. Added by hand,
          # which is exactly the failure mode this list already exists for.
          #
          # Session 30: 55_otter_quiz_attempts.sql.
          #
          # Session 31: 56_user_pets.sql + 57_user_settings.sql. All 57 are
          # here. Note the guard above globs *_<table>.sql, so both suites are
          # named for their table EXACTLY — a suite called 56_pet.sql would
          # satisfy the glob for a table named `pet` while testing something
          # else entirely.
          #
          # Session 34: 58_workspace_storage.sql. All 58 are here.
          #
          # Session 35: 59_project_folder_root.sql. All 59 are here. Like 53,
          # it covers a GUARD (fn_project_folder_root_guard on projects), not
          # a new table, so the *_<table>.sql coverage glob cannot miss it —
          # only this list can.
          #
          # Sessions 36/37: 60_workspace_storage_provider.sql,
          # 61_workspace_storage_s3.sql, 62_workspace_storage_secrets.sql.
          #
          # Session 39: 63_thumbnails_bucket.sql. Third in the 53/59 family —
          # it covers no table of its own (storage.objects policies for the
          # rabbit-thumbnails bucket, plus fn_files_gc_enqueue), so RLS_TABLES
          # above cannot see it and this list is its ONLY registration. It is
          # also deliberately NOT named 63_thumbnails.sql or 63_files.sql: the
          # guard globs *_<table>.sql with a leading wildcard, so a suite whose
          # tail matches a real table name would silently satisfy that table's
          # coverage while testing something else. `bucket` is not a table.
          #
          # Session 44: 64_thumbnail_provider.sql. Fourth in the 53/59/63
          # family, registered here for the same reason — it covers 0054's
          # storage_gc_queue.kind column and the rewritten fn_files_gc_enqueue,
          # not a table of its own. Named `_provider` deliberately: `provider`
          # is not a table either, so the glob cannot mistake it for coverage
          # of something else.
          # All 64 are here.
          #
          # Session 41: 65_workspace_storage_plans.sql. UNLIKE 53/59/63/64 this
          # one DOES cover a table of its own, so it is registered in BOTH
          # lists — `workspace_storage_plans` is in RLS_TABLES above (which
          # fails loudly, before Postgres even starts) and the file is here
          # (which fails silently — an omission still fails the job, it just
          # never says which statement broke). The two lists fail in opposite
          # directions and neither substitutes for the other.
          #
          # 🚨 The name does not collide with `workspace_storage`. That glob is
          # *_workspace_storage.sql and this file ends _workspace_storage_plans
          # .sql, so 58 still satisfies its own table and this satisfies its
          # own. Check that arithmetic before adding any suite whose table name
          # is a prefix of another.
          # All 65 are here.
          #
          # Session 43: 67_member_full_time.sql — workspace_members.is_full_time
          # (0059). Same family as 53/59/63/64: it tests a COLUMN plus a guard
          # trigger plus an RPC return list rather than a new table, so the
          # per-table coverage check above does not demand it and it has to be
          # listed here by hand. Forgetting that is how this list rots.
          # Session 42: 66_cloud_multi_gb.sql. Back in the 53/59/63/64 family —
          # it covers migrations 0057 and 0058 (the rabbit-files cap, the free
          # tier, the weighing quota predicate and the event vocabulary), none
          # of which is a table of its own, so the RLS_TABLES guard above cannot
          # see it and THIS LIST IS ITS ONLY REGISTRATION. `multi_gb` is not a
          # table name, so the *_<table>.sql glob cannot mistake it for
          # coverage of something else.
          #
          # 🚨 THIS FILE LIVES IN THE PARENT GIT ROOT, one level above WILSON/,
          # which is exactly why S42 nearly shipped without touching it — every
          # `git status` run inside WILSON/ shows a clean tree while this list
          # is stale. Session 17 is the precedent: the list stopped at 32 and
          # suites 33-38 failed INVISIBLY, with every annotation pointing at a
          # file that was fine.
          #
          # Phase 2 of the 2026-08-10 build pass: 68_phase_dependencies.sql
          # (0061). This one IS demanded by the coverage guard above, because
          # phase_dependencies is a real table and was added to RLS_TABLES — but
          # the guard only proves the FILE EXISTS. It is this list that decides
          # whether a failure inside it is ever readable. Updating one and not
          # the other is the shape of the S17 regression: the half that shouts
          # was updated, the half that explains was not.
          #
          # 2026-08-12: 69_phase_parent_status.sql (0063). Back in the
          # 53/59/63/64/66 family — it covers two COLUMNS on `phases`, not a
          # table of its own, and `phases` is already satisfied by
          # 02_phases.sql, so the RLS_TABLES guard above cannot demand it.
          # THIS LIST IS ITS ONLY REGISTRATION. Named _phase_parent_status
          # rather than _phases so the *_<table>.sql glob cannot mistake it for
          # that table's coverage.
          # All 69 are here.
          #
          # Phase 5, 2026-08-12: 70_otter_course_nominations.sql (0064). Like
          # 65_workspace_storage_plans.sql this one DOES cover a table of its
          # own, so it is registered in BOTH lists — `otter_course_nominations`
          # is in RLS_TABLES above (fails loudly, before Postgres starts) and
          # the file is here (fails silently, but is what makes a failure
          # readable). Neither substitutes for the other.
          #
          # 🚨 The name does not collide with `otter_courses`. That glob is
          # *_otter_courses.sql, and this file ends _otter_course_nominations.sql
          # — no match in either direction, so 26_otter_courses.sql stays the
          # only thing satisfying that table's coverage.
          # All 70 are here.
          #
          # Track A, bundle A2 session 2, 2026-09-07: 71_milestones.sql (0067).
          # Like 65_workspace_storage_plans.sql and 70_otter_course_nominations
          # .sql this one DOES cover a table of its own, so it is registered in
          # BOTH lists - `milestones` is in RLS_TABLES above (fails loudly,
          # before Postgres starts) and the file is here (fails silently, but is
          # what makes a failure readable). Neither substitutes for the other.
          #
          # The name collides with nothing: the guard globs *_<table>.sql, no
          # other table name ends in `milestones`, and `milestones` is not the
          # tail of any other suite's name. Check that arithmetic before adding
          # any suite whose table name is a prefix or suffix of another.
          #
          # RLS_TABLES ADDITIONS ARE NO LONGER TRACK C'S ALONE. Per
          # FIX_PLAN_2026-09-04.md (395d752, from Track B's second session): the
          # coverage guard runs per branch, so a name added without its suite on
          # the same branch goes red - each track adds its own name in the same
          # commit as the suite, and Track C resolves this list's conflicts when
          # the branches meet.
          # All 71 are here.
          #
          # Track A, 2026-09-07: 72_milestone_realtime.sql (0077, key dates
          # live-sync between windows). Registered HERE ONLY, not in RLS_TABLES:
          # it covers a TRIGGER, not a table, and `milestones` already has its
          # coverage from 71_milestones.sql. The name was checked against the
          # guard's glob before it was chosen — that glob is *_<table>.sql, and
          # this file ends _milestone_realtime.sql, so it matches neither
          # `milestones` nor any other table name, and 71 stays the only thing
          # satisfying that table. Do that arithmetic before adding a suite whose
          # name ends in something a table is called.
          # All 72 are here.
          #
          # Post-overhaul merge, review round 1 (A-R1-09, 2026-09-30): the
          # overhaul's 80_private_projects.sql (0072) and
          # 81_file_media_metadata.sql (0081) were in the directory and in
          # NEITHER list — both cover columns and a policy on tables that
          # already have their suites (projects, files), so the RLS_TABLES
          # guard above cannot demand them and THIS LIST IS THEIR ONLY
          # REGISTRATION; a failure in either was unreadable in CI. So is
          # 82_private_project_definers.sql (0082: two SECURITY DEFINER
          # bodies and two milestone write policies gain the private-project
          # arm). ⚠️ 80_private_projects.sql DOES end in a table name — it
          # matched the guard's old *_projects.sql glob, and would have stood
          # in for 01_projects.sql had that file gone (round 1's note said
          # none of the three could; merge review round 2, A-R2-05). The
          # guard above now matches NN_<table>.sql exactly, which none of
          # 80, 81 or 82 satisfies for any table in RLS_TABLES.
          # otter_quiz_attempts (0045, suite 55) joined RLS_TABLES above in
          # the same round: the table has had RLS and a suite since S30 and
          # was never in the guard. All 75 are here.
          # Track C / bundle C1, 2026-09-06: 77_upload_reservations.sql (0073).
          # Covers a table of its own, so it is registered in BOTH lists —
          # `upload_reservations` is in RLS_TABLES above and the file is here.
          # Numbered 77, not 71: migration and suite numbers are pre-assigned
          # per track (FIX_PLAN_2026-09-04.md, "Rules for running tracks in
          # tandem" — A takes 71-73, B 74-76, C 77-79), so a gap between 70
          # and 77 is expected while tracks A and B land theirs. The name ends
          # _upload_reservations.sql and matches no other table's glob.
          # 71 suites are here.
          #
          # Track C / bundle C2, 2026-09-07: 78_file_events_money.sql (0074).
          # Back in the 53/59/63/64/66 family — it covers a COLUMN and a policy
          # arm on file_events (a table 33_file_lifecycle already satisfies, via
          # the COVERED_BY map in the two-directional step above) plus three
          # RPCs on upload_reservations, not a table of its own, so THIS LIST
          # IS ITS ONLY REGISTRATION. Named _money, which is not a table, so the
          # *_<table>.sql glob cannot mistake it for coverage of something else.
          # 72 suites are here.
          #
          # Track C / bundle C3, 2026-09-07: 79_file_document_kind.sql (0075).
          # The 53/59/63/64/66/78 family again — it covers two COLUMNS on
          # `files` (document_kind, description) and asserts that the table's
          # four policies did NOT move, not a table of its own. `files` is
          # already covered by 05_files.sql, so THIS LIST IS ITS ONLY
          # REGISTRATION and nothing is added to RLS_TABLES. Named
          # _document_kind, which is not a table, so the *_<table>.sql glob
          # cannot mistake it for coverage of something else. C's reservation
          # is now fully spent: 0073/77, 0074/78, 0075/79.
          # 73 suites are here.
          #
          # Post-overhaul merge of Track C (2026-09-30): the three suites above
          # — 77_upload_reservations.sql (0073; its table is in RLS_TABLES),
          # 78_file_events_money.sql (0074/0076; columns and arms on tables
          # 33 and 46 already cover) and 79_file_document_kind.sql (0075; two
          # columns on `files`) — join the overhaul's list, which already
          # carried A's 71 and 72, B's 74 and the overhaul's 80-82.
          # 79 suites are here.
          #
          # Track C merge, review round 1 (2026-09-30, C-R1-01):
          # 83_private_project_file_gates.sql (0083). The 53/59/63/64/66/78/79
          # family — it covers the private-project arm (0072) on two SECURITY
          # DEFINER bodies (reserve_upload_bytes, log_file_downloaded) and the
          # parent hop on two `files` WRITE policies, not a table of its own:
          # `files` is 05_files.sql's and `upload_reservations` is 77's, so
          # THIS LIST IS ITS ONLY REGISTRATION and nothing is added to
          # RLS_TABLES. Named _file_gates, which is not a table, so the
          # NN_<table>.sql glob cannot mistake it for coverage of `files`
          # (a name ending _files.sql would have). 0083 / suite 83 are now
          # TAKEN; the next free numbers are 0084 / 84. The line below is
          # every *.sql in supabase/tests/rls, sorted. All 80 are here.
          #
          # Post-overhaul S3a (2026-09-30): 84_shot_lists.sql,
          # 85_shot_list_items.sql and 86_edits.sql (0084). Each covers a
          # table of its OWN, so each is registered in BOTH lists —
          # `shot_lists`, `shot_list_items` and `edits` are in RLS_TABLES above
          # (fails loudly, before Postgres starts) and the files are here
          # (fails silently, but is what makes a failure readable). The names
          # were checked against the guard's NN_<table>.sql rule: `edits` is
          # the tail of no other table and 86_edits.sql satisfies nothing but
          # `edits` (17_edit_history.sql is edit_history's, and exact), and
          # `shot_lists` / `shot_list_items` match only their own files. 0084
          # also adds probes to 01, 03, 04 and 45, which were already here.
          # 0084 / suites 84-86 are now TAKEN; the next free numbers are
          # 0085 / 87 (suite numbers 73, 75 and 76 are still unused). The line below is
          # every *.sql in supabase/tests/rls, sorted. All 83 are here.
          #
          # 0086 (2026-09-30, after the S3a hand-off; Audrey's answers on
          # withdrawing a new list or edit): 88_shot_list_withdraw.sql. It
          # covers NO new table (0086 adds a trigger to shot_lists and edits
          # and restates two RPCs), so RLS_TABLES is unchanged and the file
          # is registered here only. Its name matches no table under the
          # guard's NN_<table>.sql rule. 0085 / 87 are S4a's (file tags, on
          # its own branch, not merged here yet); 0086 / 88 are this; the
          # next free numbers are 0087 / 89 (suite numbers 73, 75 and 76 are
          # still unused). The line below is every *.sql in
          # supabase/tests/rls on this branch, sorted. All 84 are here.
          #
          # Post-overhaul S4a (0085): 87_file_tags.sql; S4b (0088):
          # 90_legal_files.sql; S5 (0089): 91_budget_versions_open.sql; S5b
          # (0090): 92_schedule_set_aside.sql — each covering columns, guards
          # and RPCs on tables that already have their suites, so THIS LIST IS
          # THEIR ONLY REGISTRATION (added by BC1 on 2026-10-07, which found
          # the four absent here while adding its own).
          #
          # Bins on the cloud, BC1 (2026-10-07, migration 0091): 93_bins.sql
          # and 94_shot_takes.sql. Both cover a table of their OWN (`bins`,
          # `shot_takes` are in RLS_TABLES above) so they are in BOTH lists;
          # 93 also covers bin_files and bin_locations, mapped to it in
          # COVERED_BY. Names checked against the NN_<table>.sql rule: 93_bins
          # satisfies `bins` only (no other table is called bins; bin_files
          # and bin_locations are different names), 94_shot_takes satisfies
          # shot_takes only. 0091 / suites 93–94 are now TAKEN; the next free
          # numbers are 0092 / 95. All 90 are here.
          #
          # The file gateway's cloud side, GW1 (2026-10-10, migration 0093):
          # 96_gateways.sql covers a table of its OWN (`gateways` is in
          # RLS_TABLES above) and maps the other five gateway tables in
          # COVERED_BY, so it is in BOTH lists. 95_legal_gate_managers.sql
          # (S4d, 0092) was absent from this line — added here by GW1, which
          # found it missing while adding its own; 0093 changes the
          # file_events_select text 95 pins. 0093 / suite 96 are TAKEN; 0094 /
          # 97 are reserved (0091's unc_path CHECK); the next free numbers are
          # 0095 / 98. All 92 are here.
          #
          # Also note what an annotation can and cannot say: this grep
          # matches SQL errors, and a failing pgTAP ASSERTION is not one.
          # "no ERROR lines" therefore means "no SQL error here", never
          # "this file passed".
          sudo apt-get install -y postgresql-client >/dev/null 2>&1 || true
          # `supabase test db` installs pgtap only for the duration of the
          # run — recreate it here or every replay dies at plan().
          for f in supabase/tests/rls/01_projects.sql supabase/tests/rls/02_phases.sql supabase/tests/rls/03_assets.sql supabase/tests/rls/04_tasks.sql supabase/tests/rls/05_files.sql supabase/tests/rls/06_comments.sql supabase/tests/rls/07_rate_cards.sql supabase/tests/rls/08_rate_card_entries.sql supabase/tests/rls/09_asset_versions.sql supabase/tests/rls/10_task_dependencies.sql supabase/tests/rls/11_task_links.sql supabase/tests/rls/12_ingestion_runs.sql supabase/tests/rls/13_ingestion_chunks.sql supabase/tests/rls/14_ws_members_self.sql supabase/tests/rls/15_provision_rpc.sql supabase/tests/rls/16_member_directory.sql supabase/tests/rls/17_edit_history.sql supabase/tests/rls/18_project_members.sql supabase/tests/rls/19_soft_delete.sql supabase/tests/rls/20_realtime.sql supabase/tests/rls/21_notes.sql supabase/tests/rls/22_note_subjects.sql supabase/tests/rls/23_workspace_realtime.sql supabase/tests/rls/24_admin_grants.sql supabase/tests/rls/25_app_events.sql supabase/tests/rls/26_otter_courses.sql supabase/tests/rls/27_otter_subjects.sql supabase/tests/rls/28_otter_progress.sql supabase/tests/rls/29_otter_course_editors.sql supabase/tests/rls/30_otter_change_requests.sql supabase/tests/rls/31_otter_trash.sql supabase/tests/rls/32_otter_cr_apply.sql supabase/tests/rls/33_file_lifecycle.sql supabase/tests/rls/34_workspace_ai_keys.sql supabase/tests/rls/35_platform_audit.sql supabase/tests/rls/36_edge_rate_limits.sql supabase/tests/rls/37_workspace_write_lockdown.sql supabase/tests/rls/38_ws_member_audit.sql supabase/tests/rls/39_platform_approved_models.sql supabase/tests/rls/40_platform_model_defaults.sql supabase/tests/rls/41_workspace_model_overrides.sql supabase/tests/rls/42_user_model_overrides.sql supabase/tests/rls/43_budget_lines.sql supabase/tests/rls/44_budget_actuals.sql supabase/tests/rls/45_budget_versions.sql supabase/tests/rls/46_expenses.sql supabase/tests/rls/47_project_rate_overrides.sql supabase/tests/rls/48_scenes.sql supabase/tests/rls/49_shots.sql supabase/tests/rls/50_levels.sql supabase/tests/rls/51_experiences.sql supabase/tests/rls/52_folders.sql supabase/tests/rls/53_money_segments.sql supabase/tests/rls/54_task_templates.sql supabase/tests/rls/55_otter_quiz_attempts.sql supabase/tests/rls/56_user_pets.sql supabase/tests/rls/57_user_settings.sql supabase/tests/rls/58_workspace_storage.sql supabase/tests/rls/59_project_folder_root.sql supabase/tests/rls/60_workspace_storage_provider.sql supabase/tests/rls/61_workspace_storage_s3.sql supabase/tests/rls/62_workspace_storage_secrets.sql supabase/tests/rls/63_thumbnails_bucket.sql supabase/tests/rls/64_thumbnail_provider.sql supabase/tests/rls/65_workspace_storage_plans.sql supabase/tests/rls/66_cloud_multi_gb.sql supabase/tests/rls/67_member_full_time.sql supabase/tests/rls/68_phase_dependencies.sql supabase/tests/rls/69_phase_parent_status.sql supabase/tests/rls/70_otter_course_nominations.sql supabase/tests/rls/71_milestones.sql supabase/tests/rls/72_milestone_realtime.sql supabase/tests/rls/74_auth_events.sql supabase/tests/rls/77_upload_reservations.sql supabase/tests/rls/78_file_events_money.sql supabase/tests/rls/79_file_document_kind.sql supabase/tests/rls/80_private_projects.sql supabase/tests/rls/81_file_media_metadata.sql supabase/tests/rls/82_private_project_definers.sql supabase/tests/rls/83_private_project_file_gates.sql supabase/tests/rls/84_shot_lists.sql supabase/tests/rls/85_shot_list_items.sql supabase/tests/rls/86_edits.sql supabase/tests/rls/87_file_tags.sql supabase/tests/rls/88_shot_list_withdraw.sql supabase/tests/rls/90_legal_files.sql supabase/tests/rls/91_budget_versions_open.sql supabase/tests/rls/92_schedule_set_aside.sql supabase/tests/rls/93_bins.sql supabase/tests/rls/94_shot_takes.sql supabase/tests/rls/95_legal_gate_managers.sql supabase/tests/rls/96_gateways.sql; do
            echo "=== psql replay: $f ==="
            # 🚨 `-t -A --no-psqlrc` IS LOAD-BEARING, ADDED 2026-08-12.
            #
            # Without them psql prints ALIGNED output, which pads every cell
            # with a leading space — so a failing assertion arrives as
            # " not ok 12 - ..." and the `^not ok` anchor in the grep below
            # could never match it. That is exactly why the 2026-08-11 break
            # produced ZERO annotations across ten consecutive red runs while
            # the step claiming to explain it reported nothing at all.
            #
            # This is also why pg_prove itself runs psql tuples-only and
            # unaligned: raw aligned psql output is not valid TAP.
            OUT=$(PGPASSWORD=postgres psql -h 127.0.0.1 -p 54322 -U postgres -d postgres \
              -t -A --no-psqlrc \
              -c 'CREATE EXTENSION IF NOT EXISTS pgtap SCHEMA extensions' \
              -c 'SET search_path TO public, extensions' \
              -v ON_ERROR_STOP=1 -e -f "$f" 2>&1 | tail -60 || true)
            echo "$OUT"
            # Surface the SQL error as an annotation — annotations are
            # readable via the public API, full logs are not.
            # 🚨 `not ok` is NOT an SQL error. A pgTAP assertion that FAILS
            # prints a plain TAP line — no ERROR, no FATAL, nothing this grep
            # used to match — so a failing assertion replayed as "clean" while
            # pg_prove correctly failed the job. That is the difference between
            # "the SQL blew up" and "the SQL ran and the answer was wrong", and
            # only the second one describes an actual broken policy or contract.
            # Matching both is the whole point of the step.
            # ⚠️ UNANCHORED, 2026-08-12. The `^` on `not ok` / `# Failed test`
            # made both patterns dead against padded psql output. Even with
            # `-t -A` above they stay unanchored: one flag removed from that
            # psql call and the anchors silently stop matching again, with no
            # test to notice. Match the text, not the column it lands in.
            ERR=$(echo "$OUT" | grep -E 'ERROR|FATAL|could not|not ok|# +Failed test' | head -6 | tr '\n' ' ')
            # 🚨 ONLY annotate a file that actually errored. This used to emit
            # an ::error:: for EVERY replayed file, falling back to "replay
            # produced no ERROR lines" when a file passed — which defeated the
            # entire purpose of the step. GitHub caps annotations at 10 per
            # step, and with 67 suites replayed in numeric order the whole
            # budget was spent announcing that 01-10 PASSED. The real failure,
            # in 67, was past the cap and unreadable — and the full log needs
            # repo admin, so there was no other way to see it. That is why the
            # pgTAP break of 2026-08-11 took three blind fixes to chase.
            #
            # The step's own comment above says annotations exist because they
            # are public and logs are not. Spend the budget on failures only.
            if [ -n "$ERR" ]; then
              echo "::error title=pgTAP replay ${f}::${ERR}"
            fi
          done

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup

  # ---------------------------------------------------------------------------
  # issue-session smoke — guards the Session 3 fix that moved JWT verification
  # from the Edge gateway (which only supports HS256 and rejected this project's
  # ES256 tokens) into the function itself via admin.auth.getUser(token).
  #
  # Local Supabase uses HS256, so this regression can ONLY be caught by probing
  # the real wilson-dev project. Requires four repo secrets — if any are
  # missing (e.g. PRs from forks) the job self-skips instead of failing.
  #
  #   DEV_SUPABASE_URL         https://<ref>.supabase.co
  #   DEV_SUPABASE_ANON_KEY    project anon key
  #   DEV_PROBE_USERNAME       workspace-scoped username of the test user
  #   DEV_PROBE_PASSWORD       that user's password
  # ---------------------------------------------------------------------------
  issue-session-smoke:
    name: issue-session smoke (wilson-dev)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: WILSON
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets availability
        id: secrets
        env:
          DEV_SUPABASE_URL: ${{ secrets.DEV_SUPABASE_URL }}
          DEV_SUPABASE_ANON_KEY: ${{ secrets.DEV_SUPABASE_ANON_KEY }}
          DEV_PROBE_USERNAME: ${{ secrets.DEV_PROBE_USERNAME }}
          DEV_PROBE_PASSWORD: ${{ secrets.DEV_PROBE_PASSWORD }}
        run: |
          if [ -z "${DEV_SUPABASE_URL}" ] || [ -z "${DEV_SUPABASE_ANON_KEY}" ] \
            || [ -z "${DEV_PROBE_USERNAME}" ] || [ -z "${DEV_PROBE_PASSWORD}" ]; then
            echo "One or more DEV_* secrets missing — skipping smoke probe."
            echo "has_secrets=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_secrets=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install jq + curl
        if: steps.secrets.outputs.has_secrets == 'true'
        run: sudo apt-get update && sudo apt-get install -y jq curl

      - name: Probe issue-session
        if: steps.secrets.outputs.has_secrets == 'true'
        env:
          SUPABASE_URL: ${{ secrets.DEV_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.DEV_SUPABASE_ANON_KEY }}
          PROBE_USERNAME: ${{ secrets.DEV_PROBE_USERNAME }}
          PROBE_PASSWORD: ${{ secrets.DEV_PROBE_PASSWORD }}
        run: |
          chmod +x scripts/probes/issue-session.sh
          scripts/probes/issue-session.sh

      # GW1 (2026-10-10): the deployed gateway-ticket with a REAL ES256 token
      # (only the hosted project signs ES256): one ticket in the wire's shape
      # for the clip the probe user may read, another company's clip and an
      # unknown id both `missing`, a forgotten gateway 404, no sign-in 401.
      # Warns and passes if GW1's dev fixture is gone (the script says why).
      - name: Probe gateway-ticket
        if: steps.secrets.outputs.has_secrets == 'true'
        env:
          SUPABASE_URL: ${{ secrets.DEV_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.DEV_SUPABASE_ANON_KEY }}
          PROBE_USERNAME: ${{ secrets.DEV_PROBE_USERNAME }}
          PROBE_PASSWORD: ${{ secrets.DEV_PROBE_PASSWORD }}
        run: |
          chmod +x scripts/probes/gateway-ticket.sh
          scripts/probes/gateway-ticket.sh

  # ---------------------------------------------------------------------------
  # unit — Vitest over renderer modules (Session 4). First suite:
  # src/permissions/roleMatrix.test.js. No Supabase, no secrets.
  # ---------------------------------------------------------------------------
  unit:
    name: Vitest (renderer units)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: WILSON
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: WILSON/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest
        run: npm test

      # Bundle B3 (Track B): the desktop loopback lock. vitest only includes
      # src/**, and this exercises electron/localToken.cjs over a real socket —
      # 401 without the token, 200 with the header, 200 with the cookie, 401
      # with a wrong one — plus a control that must fail. Runs in the unit job
      # rather than a job of its own: no database, no secrets, ~1 second.
      - name: Run desktop loopback lock harness
        run: node scripts/local-server-lock-harness.mjs

  # ---------------------------------------------------------------------------
  # e2e-auth — Playwright auth flows against wilson-dev (Session 4).
  #
  # Reuses the DEV_* secrets from issue-session-smoke: the Vite dev server is
  # built pointing at wilson-dev (VITE_* env), and the sign-in scenario runs
  # as the seeded smoke_admin. Email-dependent scenarios (invite,
  # forgot-password) need mailpit and are skipped via PLAYWRIGHT_SKIP_EMAIL=1;
  # a local-Supabase + mailpit variant is queued for the web-build session.
  # Self-skips when secrets are missing (fork PRs), same as the smoke job.
  # ---------------------------------------------------------------------------
  e2e-auth:
    name: Playwright auth (wilson-dev)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: WILSON
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets availability
        id: secrets
        env:
          DEV_SUPABASE_URL: ${{ secrets.DEV_SUPABASE_URL }}
          DEV_SUPABASE_ANON_KEY: ${{ secrets.DEV_SUPABASE_ANON_KEY }}
          DEV_PROBE_USERNAME: ${{ secrets.DEV_PROBE_USERNAME }}
          DEV_PROBE_PASSWORD: ${{ secrets.DEV_PROBE_PASSWORD }}
        run: |
          if [ -z "${DEV_SUPABASE_URL}" ] || [ -z "${DEV_SUPABASE_ANON_KEY}" ] \
            || [ -z "${DEV_PROBE_USERNAME}" ] || [ -z "${DEV_PROBE_PASSWORD}" ]; then
            echo "One or more DEV_* secrets missing — skipping Playwright job."
            echo "has_secrets=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_secrets=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.has_secrets == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: WILSON/package-lock.json

      - name: Install dependencies
        if: steps.secrets.outputs.has_secrets == 'true'
        run: npm ci

      - name: Install Chromium
        if: steps.secrets.outputs.has_secrets == 'true'
        run: npx playwright install chromium --with-deps

      - name: Run Playwright
        if: steps.secrets.outputs.has_secrets == 'true'
        env:
          VITE_SUPABASE_URL: ${{ secrets.DEV_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.DEV_SUPABASE_ANON_KEY }}
          WILSON_E2E_USERNAME: ${{ secrets.DEV_PROBE_USERNAME }}
          WILSON_E2E_PASSWORD: ${{ secrets.DEV_PROBE_PASSWORD }}
          # Session 43: sign-in is company-first, so the probe account's
          # workspace slug is now part of the flow. Unset renders as the empty
          # string and tests/e2e/authFlow.ts falls back to `smoke`, which is
          # smoke_admin's workspace on wilson-dev (measured 2026-08-10). Set
          # this secret only if DEV_PROBE_USERNAME is pointed at an account in
          # a different workspace.
          WILSON_E2E_WORKSPACE_SLUG: ${{ secrets.DEV_PROBE_WORKSPACE_SLUG }}
          PLAYWRIGHT_SKIP_EMAIL: '1'
        run: npx playwright test

      - name: Upload traces on failure
        if: failure() && steps.secrets.outputs.has_secrets == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: WILSON/test-results/
          retention-days: 7
