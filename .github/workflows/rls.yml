# =============================================================================
# .github/workflows/rls.yml
# Session 2 — RLS coverage + pgTAP suite for the RABBIT database.
#
# Repo layout note: the app lives in a WILSON/ subdirectory under the git
# root. `defaults.run.working-directory: WILSON` makes every bash step run
# inside that subdir so paths match the local dev experience.
#
# What this runs:
#   1. Supabase CLI boots a local Postgres with every migration in
#      WILSON/supabase/migrations/ applied.
#   2. `supabase test db` runs pg_prove against every file in
#      WILSON/supabase/tests/rls/*.sql — one test per RABBIT table.
#   3. A bash coverage guard fails the job if a table in the RLS allowlist
#      is missing its dedicated test file.
#
# Scope: every push to feat/* and every PR. Intentionally NOT on pushes to
# main — branch protection makes that redundant.
# =============================================================================

name: RLS tests

on:
  push:
    branches:
      - 'feat/**'
      - 'track-*'       # the parallel fix tracks (docs/sessions/HANDOFF_PROTOCOL.md), 2026-09-07
  pull_request:
    branches:
      - main
      - 'feat/**'

jobs:
  pgtap:
    name: pgTAP (Supabase local DB)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: WILSON
    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # Coverage guard — runs BEFORE spinning up Postgres so we fail fast.
      # RLS_TABLES is the allowlist of every RABBIT table under RLS. Adding a
      # new table to migration 0004 without a test file in supabase/tests/rls/
      # will cause this step to fail. Keep this list in sync with the
      # post-condition block at the bottom of 0004_rls_rabbit.sql.
      - name: Enforce per-table test coverage
        run: |
          set -euo pipefail
          RLS_TABLES=(
            projects phases assets tasks files
            comments rate_cards rate_card_entries
            asset_versions task_dependencies phase_dependencies task_links
            ingestion_runs ingestion_chunks
            edit_history
            project_members
            notes note_subjects
            app_events
            auth_events
            otter_courses otter_subjects otter_progress
            otter_course_editors otter_change_requests
            otter_course_nominations
            workspace_ai_keys platform_audit edge_rate_limits
            platform_approved_models platform_model_defaults
            workspace_model_overrides user_model_overrides
            budget_lines budget_actuals budget_versions
            expenses project_rate_overrides
            scenes shots levels experiences
            folders
            task_templates
            user_pets user_settings
            workspace_storage
            workspace_storage_secrets
            workspace_storage_plans
          )
          MISSING=()
          for t in "${RLS_TABLES[@]}"; do
            if ! ls supabase/tests/rls/*_"${t}".sql >/dev/null 2>&1; then
              MISSING+=("${t}")
            fi
          done
          if [ "${#MISSING[@]}" -ne 0 ]; then
            echo "::error::Tables without an RLS test file: ${MISSING[*]}"
            echo "Expected pattern: WILSON/supabase/tests/rls/NN_<table>.sql"
            exit 1
          fi
          echo "RLS test coverage OK for ${#RLS_TABLES[@]} tables."

      - name: Start Supabase local DB
        run: supabase start --exclude realtime,storage-api,imgproxy,edge-runtime,studio,mailpit

      # 🚨 THE SUITE'S OWN OUTPUT IS THE PRIMARY DIAGNOSTIC, and until
      # 2026-08-12 nothing captured it. pg_prove's summary NAMES the failing
      # file and the failing test number; the replay step below can only guess.
      # Full logs need repo admin, so anything not turned into an ::error::
      # annotation is invisible to everyone without admin rights — which is how
      # the 2026-08-11 break survived three blind fixes and ten red runs.
      - name: Run pgTAP suite
        run: |
          set -o pipefail
          supabase test db 2>&1 | tee /tmp/pgtap.log

      - name: Annotate pgTAP failure
        if: failure()
        run: |
          # pg_prove emits TAP: "not ok 12 - ...", "# Failed test ...",
          # "# Looks like you failed 1 test of 30", and a Result: FAIL summary.
          # Cap at 20 so one broken suite cannot exhaust GitHub's 10-per-step
          # annotation budget before the useful lines are reached.
          grep -nE 'not ok|# +Failed test|# +Looks like|Result: FAIL|ERROR|FATAL|could not' /tmp/pgtap.log \
            | head -20 \
            | while IFS= read -r line; do
                echo "::error title=pgTAP::${line}"
              done
          echo "----- full pgTAP output (tail 120) -----"
          tail -120 /tmp/pgtap.log || true

      - name: Capture logs on failure
        if: failure()
        run: |
          supabase --version || true
          supabase logs db || true
          # pg_prove's TAP summary hides the underlying SQL error — replay
          # the suites through raw psql against the local stack (db on
          # 54322) so the exact failing statement + SQLSTATE show up in the
          # job log. 03_assets is a Session-2 file that was green for
          # months; 14 is the workspace_members suite.
          #
          # Session 17: the list previously stopped at 32, so suites 33-38
          # failed INVISIBLY — the annotations said "replay produced no
          # ERROR lines" for every file it did replay while the actual
          # failure sat in a suite it never touched. Keep this list
          # exhaustive when adding a suite.
          #
          # Session 26: it is now EXHAUSTIVE, which it had never actually
          # been. Adding 52_folders exposed that thirteen of the original
          # Session-2 suites (01, 02, 04-13, 15) had never been in it at all
          # — the list began life as a curated set of suspects and only
          # became append-everything from 16 onward. Those thirteen still
          # FAILED the job when they failed; what they could not do is say
          # why, which is the whole purpose of this step. All 54 are here.
          #
          # Session 27: 53_money_segments.sql is the first suite that covers
          # no table of its own — it pins storage.objects policies and a
          # predicate function. The coverage guard above globs by TABLE name
          # (*_<table>.sql), so a suite like this is invisible to it and
          # nothing would have complained had it been left out. Added by hand,
          # which is exactly the failure mode this list already exists for.
          #
          # Session 30: 55_otter_quiz_attempts.sql.
          #
          # Session 31: 56_user_pets.sql + 57_user_settings.sql. All 57 are
          # here. Note the guard above globs *_<table>.sql, so both suites are
          # named for their table EXACTLY — a suite called 56_pet.sql would
          # satisfy the glob for a table named `pet` while testing something
          # else entirely.
          #
          # Session 34: 58_workspace_storage.sql. All 58 are here.
          #
          # Session 35: 59_project_folder_root.sql. All 59 are here. Like 53,
          # it covers a GUARD (fn_project_folder_root_guard on projects), not
          # a new table, so the *_<table>.sql coverage glob cannot miss it —
          # only this list can.
          #
          # Sessions 36/37: 60_workspace_storage_provider.sql,
          # 61_workspace_storage_s3.sql, 62_workspace_storage_secrets.sql.
          #
          # Session 39: 63_thumbnails_bucket.sql. Third in the 53/59 family —
          # it covers no table of its own (storage.objects policies for the
          # rabbit-thumbnails bucket, plus fn_files_gc_enqueue), so RLS_TABLES
          # above cannot see it and this list is its ONLY registration. It is
          # also deliberately NOT named 63_thumbnails.sql or 63_files.sql: the
          # guard globs *_<table>.sql with a leading wildcard, so a suite whose
          # tail matches a real table name would silently satisfy that table's
          # coverage while testing something else. `bucket` is not a table.
          #
          # Session 44: 64_thumbnail_provider.sql. Fourth in the 53/59/63
          # family, registered here for the same reason — it covers 0054's
          # storage_gc_queue.kind column and the rewritten fn_files_gc_enqueue,
          # not a table of its own. Named `_provider` deliberately: `provider`
          # is not a table either, so the glob cannot mistake it for coverage
          # of something else.
          # All 64 are here.
          #
          # Session 41: 65_workspace_storage_plans.sql. UNLIKE 53/59/63/64 this
          # one DOES cover a table of its own, so it is registered in BOTH
          # lists — `workspace_storage_plans` is in RLS_TABLES above (which
          # fails loudly, before Postgres even starts) and the file is here
          # (which fails silently — an omission still fails the job, it just
          # never says which statement broke). The two lists fail in opposite
          # directions and neither substitutes for the other.
          #
          # 🚨 The name does not collide with `workspace_storage`. That glob is
          # *_workspace_storage.sql and this file ends _workspace_storage_plans
          # .sql, so 58 still satisfies its own table and this satisfies its
          # own. Check that arithmetic before adding any suite whose table name
          # is a prefix of another.
          # All 65 are here.
          #
          # Session 43: 67_member_full_time.sql — workspace_members.is_full_time
          # (0059). Same family as 53/59/63/64: it tests a COLUMN plus a guard
          # trigger plus an RPC return list rather than a new table, so the
          # per-table coverage check above does not demand it and it has to be
          # listed here by hand. Forgetting that is how this list rots.
          # Session 42: 66_cloud_multi_gb.sql. Back in the 53/59/63/64 family —
          # it covers migrations 0057 and 0058 (the rabbit-files cap, the free
          # tier, the weighing quota predicate and the event vocabulary), none
          # of which is a table of its own, so the RLS_TABLES guard above cannot
          # see it and THIS LIST IS ITS ONLY REGISTRATION. `multi_gb` is not a
          # table name, so the *_<table>.sql glob cannot mistake it for
          # coverage of something else.
          #
          # 🚨 THIS FILE LIVES IN THE PARENT GIT ROOT, one level above WILSON/,
          # which is exactly why S42 nearly shipped without touching it — every
          # `git status` run inside WILSON/ shows a clean tree while this list
          # is stale. Session 17 is the precedent: the list stopped at 32 and
          # suites 33-38 failed INVISIBLY, with every annotation pointing at a
          # file that was fine.
          #
          # Phase 2 of the 2026-08-10 build pass: 68_phase_dependencies.sql
          # (0061). This one IS demanded by the coverage guard above, because
          # phase_dependencies is a real table and was added to RLS_TABLES — but
          # the guard only proves the FILE EXISTS. It is this list that decides
          # whether a failure inside it is ever readable. Updating one and not
          # the other is the shape of the S17 regression: the half that shouts
          # was updated, the half that explains was not.
          #
          # 2026-08-12: 69_phase_parent_status.sql (0063). Back in the
          # 53/59/63/64/66 family — it covers two COLUMNS on `phases`, not a
          # table of its own, and `phases` is already satisfied by
          # 02_phases.sql, so the RLS_TABLES guard above cannot demand it.
          # THIS LIST IS ITS ONLY REGISTRATION. Named _phase_parent_status
          # rather than _phases so the *_<table>.sql glob cannot mistake it for
          # that table's coverage.
          # All 69 are here.
          #
          # Phase 5, 2026-08-12: 70_otter_course_nominations.sql (0064). Like
          # 65_workspace_storage_plans.sql this one DOES cover a table of its
          # own, so it is registered in BOTH lists — `otter_course_nominations`
          # is in RLS_TABLES above (fails loudly, before Postgres starts) and
          # the file is here (fails silently, but is what makes a failure
          # readable). Neither substitutes for the other.
          #
          # 🚨 The name does not collide with `otter_courses`. That glob is
          # *_otter_courses.sql, and this file ends _otter_course_nominations.sql
          # — no match in either direction, so 26_otter_courses.sql stays the
          # only thing satisfying that table's coverage.
          # All 70 are here.
          #
          # Also note what an annotation can and cannot say: this grep
          # matches SQL errors, and a failing pgTAP ASSERTION is not one.
          # "no ERROR lines" therefore means "no SQL error here", never
          # "this file passed".
          sudo apt-get install -y postgresql-client >/dev/null 2>&1 || true
          # `supabase test db` installs pgtap only for the duration of the
          # run — recreate it here or every replay dies at plan().
          for f in supabase/tests/rls/01_projects.sql supabase/tests/rls/02_phases.sql supabase/tests/rls/03_assets.sql supabase/tests/rls/04_tasks.sql supabase/tests/rls/05_files.sql supabase/tests/rls/06_comments.sql supabase/tests/rls/07_rate_cards.sql supabase/tests/rls/08_rate_card_entries.sql supabase/tests/rls/09_asset_versions.sql supabase/tests/rls/10_task_dependencies.sql supabase/tests/rls/11_task_links.sql supabase/tests/rls/12_ingestion_runs.sql supabase/tests/rls/13_ingestion_chunks.sql supabase/tests/rls/14_ws_members_self.sql supabase/tests/rls/15_provision_rpc.sql supabase/tests/rls/16_member_directory.sql supabase/tests/rls/17_edit_history.sql supabase/tests/rls/18_project_members.sql supabase/tests/rls/19_soft_delete.sql supabase/tests/rls/20_realtime.sql supabase/tests/rls/21_notes.sql supabase/tests/rls/22_note_subjects.sql supabase/tests/rls/23_workspace_realtime.sql supabase/tests/rls/24_admin_grants.sql supabase/tests/rls/25_app_events.sql supabase/tests/rls/26_otter_courses.sql supabase/tests/rls/27_otter_subjects.sql supabase/tests/rls/28_otter_progress.sql supabase/tests/rls/29_otter_course_editors.sql supabase/tests/rls/30_otter_change_requests.sql supabase/tests/rls/31_otter_trash.sql supabase/tests/rls/32_otter_cr_apply.sql supabase/tests/rls/33_file_lifecycle.sql supabase/tests/rls/34_workspace_ai_keys.sql supabase/tests/rls/35_platform_audit.sql supabase/tests/rls/36_edge_rate_limits.sql supabase/tests/rls/37_workspace_write_lockdown.sql supabase/tests/rls/38_ws_member_audit.sql supabase/tests/rls/39_platform_approved_models.sql supabase/tests/rls/40_platform_model_defaults.sql supabase/tests/rls/41_workspace_model_overrides.sql supabase/tests/rls/42_user_model_overrides.sql supabase/tests/rls/43_budget_lines.sql supabase/tests/rls/44_budget_actuals.sql supabase/tests/rls/45_budget_versions.sql supabase/tests/rls/46_expenses.sql supabase/tests/rls/47_project_rate_overrides.sql supabase/tests/rls/48_scenes.sql supabase/tests/rls/49_shots.sql supabase/tests/rls/50_levels.sql supabase/tests/rls/51_experiences.sql supabase/tests/rls/52_folders.sql supabase/tests/rls/53_money_segments.sql supabase/tests/rls/54_task_templates.sql supabase/tests/rls/55_otter_quiz_attempts.sql supabase/tests/rls/56_user_pets.sql supabase/tests/rls/57_user_settings.sql supabase/tests/rls/58_workspace_storage.sql supabase/tests/rls/59_project_folder_root.sql supabase/tests/rls/60_workspace_storage_provider.sql supabase/tests/rls/61_workspace_storage_s3.sql supabase/tests/rls/62_workspace_storage_secrets.sql supabase/tests/rls/63_thumbnails_bucket.sql supabase/tests/rls/64_thumbnail_provider.sql supabase/tests/rls/65_workspace_storage_plans.sql supabase/tests/rls/66_cloud_multi_gb.sql supabase/tests/rls/67_member_full_time.sql supabase/tests/rls/68_phase_dependencies.sql supabase/tests/rls/69_phase_parent_status.sql supabase/tests/rls/70_otter_course_nominations.sql supabase/tests/rls/74_auth_events.sql; do
            echo "=== psql replay: $f ==="
            # 🚨 `-t -A --no-psqlrc` IS LOAD-BEARING, ADDED 2026-08-12.
            #
            # Without them psql prints ALIGNED output, which pads every cell
            # with a leading space — so a failing assertion arrives as
            # " not ok 12 - ..." and the `^not ok` anchor in the grep below
            # could never match it. That is exactly why the 2026-08-11 break
            # produced ZERO annotations across ten consecutive red runs while
            # the step claiming to explain it reported nothing at all.
            #
            # This is also why pg_prove itself runs psql tuples-only and
            # unaligned: raw aligned psql output is not valid TAP.
            OUT=$(PGPASSWORD=postgres psql -h 127.0.0.1 -p 54322 -U postgres -d postgres \
              -t -A --no-psqlrc \
              -c 'CREATE EXTENSION IF NOT EXISTS pgtap SCHEMA extensions' \
              -c 'SET search_path TO public, extensions' \
              -v ON_ERROR_STOP=1 -e -f "$f" 2>&1 | tail -60 || true)
            echo "$OUT"
            # Surface the SQL error as an annotation — annotations are
            # readable via the public API, full logs are not.
            # 🚨 `not ok` is NOT an SQL error. A pgTAP assertion that FAILS
            # prints a plain TAP line — no ERROR, no FATAL, nothing this grep
            # used to match — so a failing assertion replayed as "clean" while
            # pg_prove correctly failed the job. That is the difference between
            # "the SQL blew up" and "the SQL ran and the answer was wrong", and
            # only the second one describes an actual broken policy or contract.
            # Matching both is the whole point of the step.
            # ⚠️ UNANCHORED, 2026-08-12. The `^` on `not ok` / `# Failed test`
            # made both patterns dead against padded psql output. Even with
            # `-t -A` above they stay unanchored: one flag removed from that
            # psql call and the anchors silently stop matching again, with no
            # test to notice. Match the text, not the column it lands in.
            ERR=$(echo "$OUT" | grep -E 'ERROR|FATAL|could not|not ok|# +Failed test' | head -6 | tr '\n' ' ')
            # 🚨 ONLY annotate a file that actually errored. This used to emit
            # an ::error:: for EVERY replayed file, falling back to "replay
            # produced no ERROR lines" when a file passed — which defeated the
            # entire purpose of the step. GitHub caps annotations at 10 per
            # step, and with 67 suites replayed in numeric order the whole
            # budget was spent announcing that 01-10 PASSED. The real failure,
            # in 67, was past the cap and unreadable — and the full log needs
            # repo admin, so there was no other way to see it. That is why the
            # pgTAP break of 2026-08-11 took three blind fixes to chase.
            #
            # The step's own comment above says annotations exist because they
            # are public and logs are not. Spend the budget on failures only.
            if [ -n "$ERR" ]; then
              echo "::error title=pgTAP replay ${f}::${ERR}"
            fi
          done

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup

  # ---------------------------------------------------------------------------
  # issue-session smoke — guards the Session 3 fix that moved JWT verification
  # from the Edge gateway (which only supports HS256 and rejected this project's
  # ES256 tokens) into the function itself via admin.auth.getUser(token).
  #
  # Local Supabase uses HS256, so this regression can ONLY be caught by probing
  # the real wilson-dev project. Requires four repo secrets — if any are
  # missing (e.g. PRs from forks) the job self-skips instead of failing.
  #
  #   DEV_SUPABASE_URL         https://<ref>.supabase.co
  #   DEV_SUPABASE_ANON_KEY    project anon key
  #   DEV_PROBE_USERNAME       workspace-scoped username of the test user
  #   DEV_PROBE_PASSWORD       that user's password
  # ---------------------------------------------------------------------------
  issue-session-smoke:
    name: issue-session smoke (wilson-dev)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: WILSON
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets availability
        id: secrets
        env:
          DEV_SUPABASE_URL: ${{ secrets.DEV_SUPABASE_URL }}
          DEV_SUPABASE_ANON_KEY: ${{ secrets.DEV_SUPABASE_ANON_KEY }}
          DEV_PROBE_USERNAME: ${{ secrets.DEV_PROBE_USERNAME }}
          DEV_PROBE_PASSWORD: ${{ secrets.DEV_PROBE_PASSWORD }}
        run: |
          if [ -z "${DEV_SUPABASE_URL}" ] || [ -z "${DEV_SUPABASE_ANON_KEY}" ] \
            || [ -z "${DEV_PROBE_USERNAME}" ] || [ -z "${DEV_PROBE_PASSWORD}" ]; then
            echo "One or more DEV_* secrets missing — skipping smoke probe."
            echo "has_secrets=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_secrets=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install jq + curl
        if: steps.secrets.outputs.has_secrets == 'true'
        run: sudo apt-get update && sudo apt-get install -y jq curl

      - name: Probe issue-session
        if: steps.secrets.outputs.has_secrets == 'true'
        env:
          SUPABASE_URL: ${{ secrets.DEV_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.DEV_SUPABASE_ANON_KEY }}
          PROBE_USERNAME: ${{ secrets.DEV_PROBE_USERNAME }}
          PROBE_PASSWORD: ${{ secrets.DEV_PROBE_PASSWORD }}
        run: |
          chmod +x scripts/probes/issue-session.sh
          scripts/probes/issue-session.sh

  # ---------------------------------------------------------------------------
  # unit — Vitest over renderer modules (Session 4). First suite:
  # src/permissions/roleMatrix.test.js. No Supabase, no secrets.
  # ---------------------------------------------------------------------------
  unit:
    name: Vitest (renderer units)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: WILSON
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: WILSON/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest
        run: npm test

  # ---------------------------------------------------------------------------
  # e2e-auth — Playwright auth flows against wilson-dev (Session 4).
  #
  # Reuses the DEV_* secrets from issue-session-smoke: the Vite dev server is
  # built pointing at wilson-dev (VITE_* env), and the sign-in scenario runs
  # as the seeded smoke_admin. Email-dependent scenarios (invite,
  # forgot-password) need mailpit and are skipped via PLAYWRIGHT_SKIP_EMAIL=1;
  # a local-Supabase + mailpit variant is queued for the web-build session.
  # Self-skips when secrets are missing (fork PRs), same as the smoke job.
  # ---------------------------------------------------------------------------
  e2e-auth:
    name: Playwright auth (wilson-dev)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: WILSON
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets availability
        id: secrets
        env:
          DEV_SUPABASE_URL: ${{ secrets.DEV_SUPABASE_URL }}
          DEV_SUPABASE_ANON_KEY: ${{ secrets.DEV_SUPABASE_ANON_KEY }}
          DEV_PROBE_USERNAME: ${{ secrets.DEV_PROBE_USERNAME }}
          DEV_PROBE_PASSWORD: ${{ secrets.DEV_PROBE_PASSWORD }}
        run: |
          if [ -z "${DEV_SUPABASE_URL}" ] || [ -z "${DEV_SUPABASE_ANON_KEY}" ] \
            || [ -z "${DEV_PROBE_USERNAME}" ] || [ -z "${DEV_PROBE_PASSWORD}" ]; then
            echo "One or more DEV_* secrets missing — skipping Playwright job."
            echo "has_secrets=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_secrets=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.has_secrets == 'true'
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: WILSON/package-lock.json

      - name: Install dependencies
        if: steps.secrets.outputs.has_secrets == 'true'
        run: npm ci

      - name: Install Chromium
        if: steps.secrets.outputs.has_secrets == 'true'
        run: npx playwright install chromium --with-deps

      - name: Run Playwright
        if: steps.secrets.outputs.has_secrets == 'true'
        env:
          VITE_SUPABASE_URL: ${{ secrets.DEV_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.DEV_SUPABASE_ANON_KEY }}
          WILSON_E2E_USERNAME: ${{ secrets.DEV_PROBE_USERNAME }}
          WILSON_E2E_PASSWORD: ${{ secrets.DEV_PROBE_PASSWORD }}
          # Session 43: sign-in is company-first, so the probe account's
          # workspace slug is now part of the flow. Unset renders as the empty
          # string and tests/e2e/authFlow.ts falls back to `smoke`, which is
          # smoke_admin's workspace on wilson-dev (measured 2026-08-10). Set
          # this secret only if DEV_PROBE_USERNAME is pointed at an account in
          # a different workspace.
          WILSON_E2E_WORKSPACE_SLUG: ${{ secrets.DEV_PROBE_WORKSPACE_SLUG }}
          PLAYWRIGHT_SKIP_EMAIL: '1'
        run: npx playwright test

      - name: Upload traces on failure
        if: failure() && steps.secrets.outputs.has_secrets == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: WILSON/test-results/
          retention-days: 7
