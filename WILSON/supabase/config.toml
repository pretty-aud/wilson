# Supabase project config — linked to wilson-dev by default.
# Switch envs via `supabase link --project-ref <ref>` before running
# `supabase db push` / `supabase functions deploy`.

project_id = "wilson-dev"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5203"
additional_redirect_urls = ["http://localhost:5203"]
jwt_expiry = 3600
enable_signup = false  # Admin-only user creation for WILSON; no self-signup.
enable_confirmations = false

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = false

# Custom Access Token hook — bakes workspace_id + app_role into JWT app_metadata
# on every token issuance. Deployed via `supabase functions deploy issue-session`
# and configured in Dashboard → Auth → Hooks.
[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/public/custom_access_token_hook"

[functions]
verify_jwt = false  # per-function; resolve-login is intentionally public

[analytics]
enabled = false
